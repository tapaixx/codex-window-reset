name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          check-latest: true
          cache: false

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Run Go tests
        run: go test ./...

      - name: Run Go race tests
        run: go test -race ./...

      - name: Run Go vet
        run: go vet ./...

      - name: Install Chromium for browser acceptance tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y chromium

      - name: Run Node tests
        run: BROWSER_BIN=/usr/bin/chromium node --test web/tests/*.test.mjs

      - name: Build Linux amd64 plugin
        run: CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go build -buildmode=c-shared -o /tmp/codex-window-reset-amd64.so .

      - name: Install the arm64 cross compiler
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu

      - name: Build Linux arm64 plugin
        run: CC=aarch64-linux-gnu-gcc CGO_ENABLED=1 GOOS=linux GOARCH=arm64 go build -buildmode=c-shared -o /tmp/codex-window-reset-arm64.so .

  verify-supported-architectures:
    name: Native ${{ matrix.architecture }} verification
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
            goarch: amd64
          - architecture: arm64
            runner: ubuntu-24.04-arm
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: 1.24.x
          check-latest: true
          cache: false

      - name: Set up Node LTS
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Chromium for browser acceptance tests
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y chromium

      - name: Run format, static, and test checks
        run: |
          gofmt -w $(find . -name '*.go' -not -path './.git/*')
          go vet ./...
          go test -count=1 ./...
          go test -count=1 -race ./...
          BROWSER_BIN=/usr/bin/chromium node --test web/tests/*.test.mjs

      - name: Build native shared library
        run: CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} go build -trimpath -buildmode=c-shared -o "/tmp/codex-window-reset-${{ matrix.architecture }}.so" .
